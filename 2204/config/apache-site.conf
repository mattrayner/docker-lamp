<VirtualHost *:8080>
    ServerAdmin webmaster@localhost
    DocumentRoot "${APACHE_ROOT}"

    RedirectMatch 302 ^/adminer$ /adminer/
    Alias /adminer/ /usr/local/share/adminer/

    <Directory /usr/local/share/adminer>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        DirectoryIndex index.php
        Require all granted
    </Directory>

    <Directory "${APACHE_ROOT}">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
    IncludeOptional /run/lamp/apache2/http-redirect.conf
</VirtualHost>

IncludeOptional /run/lamp/apache2/tls.conf
