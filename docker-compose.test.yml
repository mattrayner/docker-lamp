services:
  web2204:
    image: docker-lamp-test:2204
    build:
      context: .
      dockerfile: ./2204/Dockerfile
    environment:
      MYSQL_ADMIN_PASS: test-admin-password-2204
    ports:
      - "3020:80"
      - "3021:3306"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./tests/fixtures:/test-fixtures:ro

  web2404:
    image: docker-lamp-test:2404
    build:
      context: .
      dockerfile: ./2404/Dockerfile
    environment:
      MYSQL_ADMIN_PASS: test-admin-password-2404
    ports:
      - "3040:80"
      - "3041:3306"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./tests/fixtures:/test-fixtures:ro

  web2604:
    image: docker-lamp-test:2604
