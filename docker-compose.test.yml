services:
  web2204:
    image: ${TEST_IMAGE:-docker-lamp-test:2204}
    build:
      context: .
      dockerfile: ./2204/Dockerfile
      args:
        PHP_ARTIFACT_IMAGE: ${TEST_PHP_ARTIFACT_IMAGE:-docker-lamp-php-artifact:2204}
    environment:
      MYSQL_ADMIN_PASS: test-admin-password-2204
    user: "1000:1000"
    ports:
      - "3020:8080"
    tmpfs:
      - /var/lib/mysql:uid=1000,gid=1000,mode=0750
    volumes:
      - ./tests/fixtures:/test-fixtures:ro
      - ./tests/fixtures/apache-test-fixtures.conf:/etc/apache2/conf-enabled/test-fixtures.conf:ro

  web2404:
    image: ${TEST_IMAGE:-docker-lamp-test:2404}
