[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/lamp/supervisor/supervisord.pid
childlogdir=/tmp
exitwhenfinished=true

[unix_http_server]
file=/run/lamp/supervisor/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/lamp/supervisor/supervisor.sock

[program:mysqld]
command=/usr/local/bin/start-mysqld
priority=10
autostart=true
autorestart=false
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=30
environment=MYSQL_STOP_GRACE_SECONDS="20"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:apache2]
command=/usr/local/bin/start-apache2
priority=20
autostart=true
autorestart=false
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
